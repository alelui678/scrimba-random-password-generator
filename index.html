<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <div class="container">
        <h2>Generate a</h2>
        <h2 class="color-green">random password</h2>
        <p>Never use an insecure password again.</p>
        <div class="interactive-section">
            <button class="gen-psw-btn">Generate password</button>
            <div class="slider-section">
                <span>Password Length:</span>
                <span class="slider-label">12</span>
                <input type="range" min="8" max="20" value="12" class="length-slider">
            </div>

        </div>
        <hr>
        <div class="psw-container">
            <div class="psw-box"></div>
            <div class="psw-box"></div>
        </div>
    </div>
    <script src="main.js"></script>
</body>

</html>
